name: Deploy to Windows Server IIS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment (Staging or Production)'
        required: true
        default: 'Staging'

jobs:
  deploy-iis:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish ASP.NET Core Application
      run: >
        dotnet publish src/SafeDeployStudio.Web/SafeDeployStudio.Web.csproj
        --configuration Release
        --output ./publish/iis-package

    - name: Upload Deployment Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SafeDeployStudio-IIS-Package
        path: ./publish/iis-package/
