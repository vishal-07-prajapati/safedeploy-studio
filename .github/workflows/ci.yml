name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore SafeDeployStudio.slnx

    - name: Build Solution
      run: dotnet build SafeDeployStudio.slnx --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test tests/SafeDeployStudio.UnitTests/SafeDeployStudio.UnitTests.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

    - name: Run Integration Tests
      run: dotnet test tests/SafeDeployStudio.IntegrationTests/SafeDeployStudio.IntegrationTests.csproj --configuration Release --no-build --verbosity normal
